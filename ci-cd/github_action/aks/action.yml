name: Azure AKS Terraform Setup
description: Set up Terraform and initialize the Azure AKS working directory.

inputs:
  tf_working_dir:
    description: Path to the AKS Terraform folder
    required: true
    default: clouds/azure/aks
  tf_state_key:
    description: Remote backend state key when backend secrets are configured
    required: false
    default: infra/azure/aks/terraform.tfstate
  terraform_version:
    description: Terraform version to install
    required: false
    default: 1.9.8
  backend:
    description: Set to "false" to init without any backend (for fmt/validate only)
    required: false
    default: 'true'
  backend_resource_group:
    description: Resource group holding the Terraform state storage account
    required: false
    default: ''
  backend_storage_account:
    description: Storage account holding the Terraform state
    required: false
    default: ''
  backend_container:
    description: Blob container holding the Terraform state
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform_version }}
        terraform_wrapper: false

    - name: Terraform Init
      shell: bash
      working-directory: ${{ inputs.tf_working_dir }}
      env:
        TF_BACKEND: ${{ inputs.backend }}
        TF_BACKEND_RESOURCE_GROUP: ${{ inputs.backend_resource_group }}
        TF_BACKEND_STORAGE_ACCOUNT: ${{ inputs.backend_storage_account }}
        TF_BACKEND_CONTAINER: ${{ inputs.backend_container }}
        TF_STATE_KEY: ${{ inputs.tf_state_key }}
      run: |
        set -eu

        if [[ "${TF_BACKEND}" != "true" ]]; then
          echo "Initializing without a backend (validation only)."
          terraform init -input=false -backend=false
        elif [[ -n "${TF_BACKEND_RESOURCE_GROUP}" && -n "${TF_BACKEND_STORAGE_ACCOUNT}" && -n "${TF_BACKEND_CONTAINER}" ]]; then
          echo "Initializing with the azurerm backend."
          terraform init \
            -input=false \
            -backend-config="resource_group_name=${TF_BACKEND_RESOURCE_GROUP}" \
            -backend-config="storage_account_name=${TF_BACKEND_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${TF_BACKEND_CONTAINER}" \
            -backend-config="key=${TF_STATE_KEY}"
        else
          echo "Backend secrets are not set; initializing with local state."
          terraform init -input=false
        fi
