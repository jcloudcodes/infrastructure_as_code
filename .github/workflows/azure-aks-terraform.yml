name: Azure AKS Terraform

on:
  push:
    branches:
      - main
    paths:
      - 'clouds/azure/aks/**'
      - 'ci-cd/github_action/aks/**'
      - '.github/workflows/azure-aks-terraform.yml'

  workflow_dispatch:
    inputs:
      tf_action:
        description: Terraform action
        required: true
        default: apply
        type: choice
        options:
          - plan
          - apply
          - destroy

# Never let two runs touch the same remote state at the same time.
concurrency:
  group: azure-aks-terraform
  cancel-in-progress: false

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Terraform Format Check
        working-directory: clouds/azure/aks
        run: terraform fmt -check -recursive

  validate:
    name: Validate
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform and Init
        uses: ./ci-cd/github_action/aks
        with:
          tf_working_dir: clouds/azure/aks
          backend: 'false'

      - name: Terraform Validate
        working-directory: clouds/azure/aks
        run: terraform validate

  plan:
    name: Plan
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.tf_action || 'apply') != 'destroy' }}

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform and Init
        uses: ./ci-cd/github_action/aks
        with:
          tf_working_dir: clouds/azure/aks
          tf_state_key: jcloudcodes/aks/centralus/terraform.tfstate
          backend_resource_group: ${{ secrets.TF_BACKEND_RESOURCE_GROUP }}
          backend_storage_account: ${{ secrets.TF_BACKEND_STORAGE_ACCOUNT }}
          backend_container: ${{ secrets.TF_BACKEND_CONTAINER }}

      - name: Terraform Plan
        working-directory: clouds/azure/aks
        run: |
          terraform plan \
            -input=false \
            -var-file="aks.auto.tfvars" \
            -out=tfplan

      - name: Plan Summary
        working-directory: clouds/azure/aks
        run: |
          {
            echo '## Terraform Plan'
            echo '```terraform'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            clouds/azure/aks/tfplan
            clouds/azure/aks/.terraform.lock.hcl
          retention-days: 5
          if-no-files-found: error

  apply:
    name: Apply
    runs-on: ubuntu-latest
    needs: plan
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.tf_action || 'apply') == 'apply' }}

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: clouds/azure/aks

      - name: Setup Terraform and Init
        uses: ./ci-cd/github_action/aks
        with:
          tf_working_dir: clouds/azure/aks
          tf_state_key: jcloudcodes/aks/centralus/terraform.tfstate
          backend_resource_group: ${{ secrets.TF_BACKEND_RESOURCE_GROUP }}
          backend_storage_account: ${{ secrets.TF_BACKEND_STORAGE_ACCOUNT }}
          backend_container: ${{ secrets.TF_BACKEND_CONTAINER }}

      - name: Terraform Apply
        working-directory: clouds/azure/aks
        run: terraform apply -input=false -auto-approve tfplan

      - name: Outputs
        working-directory: clouds/azure/aks
        run: |
          {
            echo '## Terraform Outputs'
            echo '```'
            terraform output -no-color || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  destroy:
    name: Destroy
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.tf_action == 'destroy' }}

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform and Init
        uses: ./ci-cd/github_action/aks
        with:
          tf_working_dir: clouds/azure/aks
          tf_state_key: jcloudcodes/aks/centralus/terraform.tfstate
          backend_resource_group: ${{ secrets.TF_BACKEND_RESOURCE_GROUP }}
          backend_storage_account: ${{ secrets.TF_BACKEND_STORAGE_ACCOUNT }}
          backend_container: ${{ secrets.TF_BACKEND_CONTAINER }}

      - name: Terraform Destroy
        working-directory: clouds/azure/aks
        run: |
          terraform destroy \
            -input=false \
            -auto-approve \
            -var-file="aks.auto.tfvars"
